<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cromopoética — un pantonario de la poesía</title>
  <desc id="desc">Tarjeta social de CromoPoética, un pantonario de la poesía.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFE9DA"/>
      <stop offset="100%" stop-color="#D9C9AB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3E2C28" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle cx="1070" cy="108" r="210" fill="#D85D45" opacity=".95"/>
  <circle cx="972" cy="531" r="182" fill="#2D6570" opacity=".94"/>
  <circle cx="154" cy="549" r="147" fill="#D4A72C" opacity=".9"/>
